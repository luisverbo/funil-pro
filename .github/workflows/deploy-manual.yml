# ============================================================================
# Deploy REDUNDANTE — sem nenhuma action externa.
# ----------------------------------------------------------------------------
# Por que existe: o deploy automático falhou repetidamente ANTES de tocar o
# código, sempre no mesmo ponto — "Failed to resolve action download info" /
# "Set up job failure". Esse passo é o download de `actions/checkout@v4`: quando
# o serviço de actions do GitHub oscila, o job morre no provisionamento.
#
# Este workflow não usa `uses:` em lugar nenhum. Sem action para resolver, não
# há o que falhar no provisionamento: o próprio runner já traz git e node, e o
# clone é feito com o token embutido do job.
#
# Roda em PARALELO ao deploy.yml de propósito: se um falhar por infraestrutura,
# o outro publica o mesmo commit. Publicar duas vezes o mesmo código é
# inofensivo — ficar sem publicar não é.
# ============================================================================
name: Deploy redundante (sem actions externas)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo do deploy manual (fica no histórico)'
        required: false
        default: 'publicação sob demanda'

# Um deploy por vez nesta via; nunca cancela o que já está publicando.
concurrency:
  group: deploy-redundante-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório (git puro, sem action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo && git log -1 --oneline

      - name: Publicar na Vercel (com novas tentativas)
        working-directory: repo
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: bkiDeo1Zjj1wLD1AFfT9D7Iz
          VERCEL_PROJECT_ID: prj_eRXulORN1u2x2WvvUTEtJhdv743H
        run: |
          mkdir -p .vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
          npm i -g vercel@latest --quiet
          for tentativa in 1 2 3; do
            if vercel deploy --prod --token "$VERCEL_TOKEN" --yes; then
              echo "deploy concluído na tentativa $tentativa"
              exit 0
            fi
            echo "tentativa $tentativa falhou; aguardando…"
            sleep $((tentativa * 15))
          done
          echo "as três tentativas falharam"
          exit 1
